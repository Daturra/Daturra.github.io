<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Villa Game: Build Your Bali Villa</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f7e7d6;--panel:#f4bf98;--card:#fff6ec;--ink:#1f2a33;--acc:#14607f;--acc2:#d8602b;--sea:#bfe3ee;--land:#a9c98f;--line:#1f2a3322;--ok:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--panel:#4a3427;--card:#2a211b;--ink:#f6ece2;--acc:#6cc3e3;--acc2:#ff9a62;--sea:#1d3b4a;--land:#47643a;--line:#ffffff22}}
:root[data-theme="dark"]{--bg:#171412;--panel:#4a3427;--card:#2a211b;--ink:#f6ece2;--acc:#6cc3e3;--acc2:#ff9a62;--sea:#1d3b4a;--land:#47643a;--line:#ffffff22}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
#app{max-width:1080px;margin:0 auto;padding:12px;display:grid;gap:12px;grid-template-columns:1fr 310px;grid-template-areas:"top top" "main opt" "main db"}
@media(max-width:820px){#app{grid-template-columns:1fr;grid-template-areas:"top" "main" "opt" "db"}}
.top{grid-area:top;display:flex;gap:10px;align-items:stretch}
.av{width:58px;min-width:58px;border-radius:16px;background:var(--acc);display:grid;place-items:center;font-size:30px}
.bubble{flex:1.2;background:var(--acc);color:#fff;border-radius:14px 14px 14px 2px;padding:9px 12px;font-size:14px;min-height:58px}
:root[data-theme="dark"] .bubble{color:#10222b}
.prog{flex:2;background:var(--panel);border-radius:14px;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.pl{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;flex-wrap:wrap}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc2);transition:width .4s}
.card{background:var(--panel);border-radius:22px;padding:12px}
.main{grid-area:main;display:flex;flex-direction:column;gap:10px;min-height:340px}
.opt{grid-area:opt}.db{grid-area:db;background:var(--card);border:2px solid var(--panel)}
h3{margin:2px 0 8px;font-size:16px}
.btn{display:block;width:100%;text-align:left;margin:0 0 7px;padding:9px 11px;border-radius:11px;border:2px solid transparent;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.btn:hover{border-color:var(--acc)}.btn:focus-visible,.go:focus-visible,a.go:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.btn.on{border-color:var(--acc2);background:var(--acc);color:#fff;font-weight:700}
:root[data-theme="dark"] .btn.on{color:#10222b}
.btn small{display:block;font-weight:400;opacity:.85}
.go{display:block;width:100%;padding:11px;border-radius:12px;border:0;background:var(--acc2);color:#fff;font:700 15px "Trebuchet MS","Segoe UI",system-ui,sans-serif;cursor:pointer;text-align:center;text-decoration:none;margin-top:6px}
.go:disabled{opacity:.4;cursor:not-allowed}
.db label{display:block;font-size:12px;font-weight:700;margin-top:7px}
.db input,.db select{width:100%;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.db .kv{font-size:13px;margin-top:6px}
.map{width:100%;height:auto;border-radius:16px;display:block}
.sea{fill:var(--sea)}.land{fill:var(--land);stroke:var(--ink);stroke-opacity:.35;stroke-width:1.5}
.pin{cursor:pointer}.pin text{font:700 11px sans-serif;fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--card);border-radius:12px;padding:8px 10px}.stat b{display:block;font-size:17px}
.stat span{font-size:12px;opacity:.8}
.note{font-size:13px;background:var(--card);border-radius:10px;padding:8px 10px;margin-top:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{width:44px;height:44px;border-radius:10px;border:2px solid var(--card)}
.slots i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:3px;background:var(--acc2)}.slots i.x{background:var(--line)}
input[type=range]{width:100%;accent-color:var(--acc2)}
.pulse{animation:p 1.4s infinite}@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="av" id="av">🧑‍💼</div><div class="bubble" id="bub"></div>
  <div class="prog"><div class="pl"><span id="pt"></span><span id="px"></span></div><div class="bar"><i id="pf"></i></div></div>
 </div>
 <div class="card main" id="main"></div>
 <div class="card opt" id="opt"></div>
 <div class="db card" id="db"></div>
</div>
<script>
// Ganti dengan data kuota nyata sebelum dipublikasikan.
const SLOTS_LEFT=5,SLOTS_TOTAL=20,CTA_URL='https://mysea.id';
const Z={
 ubud:{n:'Ubud',tier:'Ekonomis',land:1.2,roi:12,base:1.8,c:'#8ecae6',x:225,y:112},
 canggu:{n:'Canggu',tier:'Luxury',land:2.2,roi:13,base:3,c:'#2a9bc4',x:140,y:158},
 uluwatu:{n:'Uluwatu',tier:'Premium',land:2.8,roi:15,base:3.8,c:'#0b3a5c',x:200,y:222}};
const ROLES=['Pemandu Virtual','Ahli Properti Lokal','Ahli Properti Lokal','Arsitek','Desainer Interior','Konsultan Finansial','General Manager','General Manager'];
const FACE=['🧑‍💼','👨‍💼','👨‍💼','👷','👩‍🎨','🧑‍💻','🕴️','🕴️'];
const NAMES=['Inisiasi','Pilih Lokasi','Anggaran & Kunci Lahan','Desain Eksterior','Desain Interior','Simulasi Finansial','Manajemen Properti','Selesai'];
const CD=['Epic Meaning','Accomplishment','Accomplishment','Creativity & Feedback','Creativity & Feedback','Ownership','Scarcity & Loss Prevention','Scarcity'];
const GREET=[
 'Selamat datang! Bali menunggu seseorang membangun villa impiannya. Siap memulai perjalananmu?',
 'Pilih kawasan. Warna biru tua berarti premium, biru muda lebih ekonomis. Klik pin di peta.',
 'Pilih kontur lahan dan tingkat anggaran, lalu kunci lahanmu dengan nomor WhatsApp.',
 'Saatnya mendesain! Pilih gaya bangunan, kolam, dan jumlah lantai, lalu lihat hasilnya langsung.',
 'Sekarang interiornya. Pilih furnitur untuk tiap area dan lihat palet warnanya menyatu.',
 'Villamu sudah jadi. Atur tarif harian, jalankan simulasi sewa, dan cek ROI-nya.',
 'Kamu sekarang pengelola villa. Hadapi kejadian tak terduga dan kelola stafmu dengan baik.',
 'Selamat, villamu beroperasi! Konsultasi eksklusif tersedia untuk kuota terbatas.'];
const GOALS=['Villa Liburan Pribadi','Investasi Sewa','Keduanya'];
const F={living:['Living Set Rotan (Standar)','Living Set Teak Premium'],bed:['Kamar Minimalis (Standar)','Koleksi Kamar Suite Premium'],out:['Dekor Taman Sederhana','Dekor Outdoor Lounge Premium']};
const FN={living:'Living Room',bed:'Bedroom',out:'Outdoor Decor'};
const PAL={trop:['#8b5e3c','#4f7a4a','#e8dcc4','#2f4858'],med:['#f4efe6','#c8643b','#2e6f95','#d9b36c']};
const EV=[
 {t:'🧳 Tamu datang mendadak',d:'Tamu tiba 6 jam lebih awal, kamar belum siap.',c:[['Siapkan welcome drink dan upgrade kamar',2],['Tawarkan penitipan koper dan kopi gratis',1],['Minta mereka menunggu',0]]},
 {t:'📦 Pasokan terlambat',d:'Linen dan amenities dari vendor terlambat 2 hari.',c:[['Beli cadangan dari vendor lokal',2],['Pesan ekspres dengan harga mahal',1],['Tunggu pengiriman',0]]},
 {t:'⚡ Listrik padam',d:'Pemadaman mendadak saat tamu sedang menginap.',c:[['Nyalakan genset cadangan',2],['Hubungi teknisi dan beri lilin',1],['Abaikan, nanti juga menyala',0]]},
 {t:'🏊 Kolam keruh',d:'Tamu mengeluh air kolam keruh sebelum sore.',c:[['Panggil teknis kolam dan buka area alternatif',2],['Tambah kaporit sendiri',1],['Biarkan sampai besok',0]]},
 {t:'❄️ AC rusak',d:'AC kamar utama berhenti dingin di tengah malam.',c:[['Pindahkan tamu ke kamar lain dan perbaiki',2],['Kirim kipas angin',1],['Sarankan buka jendela',0]]}];
const S={stage:0,name:'',ig:'',goal:'',zone:null,ground:null,plot:null,wa:'',locked:false,style:null,pool:null,floors:null,furn:{},career:'',age:'30–45',rate:0,touched:false,sims:0,roi:false,friends:'',reviews:[],ev:[],evDone:0,evScore:0,staff:{},pts:0,msg:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fM=n=>'Rp '+n.toFixed(2).replace('.',',')+' M';
const fR=n=>'Rp '+Math.round(n*1e6).toLocaleString('id-ID');
const prem=()=>Object.values(S.furn).filter(v=>v===1).length;
const cost=()=>{const z=Z[S.zone];return z.land*(S.ground==='slope'?.9:1)+(S.plot==='prem'?.4:0)+.8+(S.style==='med'?.15:0)+(S.pool?.15:0)+(S.floors==2?.3:0)+prem()*.1};
const base=()=>Z[S.zone].base+(S.plot==='prem'?.3:0)+(S.pool?.3:0)+prem()*.15+(S.floors==2?.2:0);
const occ=r=>Math.min(.95,Math.max(.25,.7-.35*(r/base()-1)));
const rev=r=>r*occ(r);
const roi=()=>rev(S.rate)*365*.55/1000/cost()*100;
const opt=()=>Math.min(100,rev(S.rate)/rev(1.5*base())*100);
const perf=()=>Math.min(100,40+Object.values(S.staff).filter(Boolean).length*10+S.evScore*5);
const mgmt=()=>(1+4*S.evScore/6).toFixed(1);
const waOk=()=>S.wa.replace(/\D/g,'').length>=9;
function sub(){switch(S.stage){
 case 0:return ((S.name.trim()?1:0)+(S.goal?1:0))/2;
 case 1:return S.zone?1:0;
 case 2:return ((S.ground?1:0)+(S.plot?1:0)+(S.locked?1:0))/3;
 case 3:return ((S.style?1:0)+(S.pool!==null?1:0)+(S.floors?1:0))/3;
 case 4:return Object.keys(S.furn).length/3;
 case 5:return ((S.sims>0?1:0)+(S.roi?1:0)+(S.touched?1:0))/3;
 case 6:return S.evDone/3;
 default:return 1}}
function up(){const s=sub(),n=Math.min(S.stage,7);
 $('pf').style.width=Math.min(100,(n+s)/7*100)+'%';
 $('pt').textContent=S.stage>6?'SELESAI':'Tahap '+(n+1)+'/7: '+NAMES[n];
 $('px').textContent='Core Drive '+(n<1?1:n<3?2:n<5?3:n<6?4:5)+': '+CD[n]+' | '+S.pts+' XP | '+Math.round(s*100)+'%';
 const g=$('go');if(g)g.disabled=s<.999;}
function say(t){S.msg=t;$('bub').textContent=t}
function add(n){S.pts+=n}
function set(k,v){S[k]=v;add(5);if(k==='pool'||k==='style'||k==='floors')say(['Pilihan bagus, tampilannya makin hidup!','Estetik sempurna!','Proporsinya harmonis, saya suka.'][Math.floor(Math.random()*3)]);render()}
function next(){add(50);S.stage++;S.msg='';if(S.stage===5&&!S.rate)S.rate=+base().toFixed(1);
 if(S.stage===6&&!S.ev.length)S.ev=EV.slice().sort(()=>Math.random()-.5).slice(0,3);render();window.scrollTo(0,0)}
function pickZone(k){if(S.stage!==1)return;S.zone=k;add(10);const z=Z[k];say(z.n+': ROI sekitar '+z.roi+'%+ per tahun, kelas '+z.tier+'. Harga lahan mulai '+fM(z.land)+'.');render()}
function lockLand(){if(!S.ground||!S.plot)return say('Pilih kontur tanah dan tingkat anggaran dulu.');
 if(!waOk())return say('Isi nomor WhatsApp-mu agar kami bisa mengirim rincian harga.');
 S.locked=true;add(30);say('Lahan terkunci! Total biaya lahan '+fM(Z[S.zone].land*(S.ground==='slope'?.9:1)+(S.plot==='prem'?.4:0))+'. Tahap berikutnya sudah terbuka.');render()}
function pickF(k,i){S.furn[k]=i;add(5);say(i?'Pilihan premium! Palet warnanya terasa mewah.':'Pilihan hemat yang tetap nyaman.');render()}
function setRate(v){S.rate=+v;S.touched=true;$('fin').innerHTML=fin();$('rt').textContent=fR(S.rate)+' / malam';up()}
function sim(){S.sims++;add(15);const o=opt(),pool=['Villa bersih dan stafnya ramah sekali.','Pemandangan luar biasa, pasti kembali.','Lokasi strategis dan tenang.','Harga agak mahal untuk kamarnya.','Kolamnya indah, kamarnya nyaman.'];
 const good=S.rate<=1.25*base();const r=(good?5:3)-(Math.random()<.3?1:0);
 S.reviews.unshift('⭐'.repeat(r)+' '+(good?pool[Math.floor(Math.random()*3)]:pool[3]));S.reviews=S.reviews.slice(0,3);
 say('Simulasi selesai: okupansi '+Math.round(occ(S.rate)*100)+'%, optimasi '+Math.round(o)+'%. '+(o>=85?'Optimasi villamu tinggi!':'Coba sesuaikan tarif harian.'));render()}
function calc(){S.roi=true;add(15);say('ROI proyeksi '+roi().toFixed(1)+'% per tahun dari modal '+fM(cost())+'. Tarif optimal ada di sekitar '+fR(1.5*base())+'.');render()}
function staff(k){S.staff[k]=!S.staff[k];render()}
function choose(i){const e=S.ev[S.evDone],sc=e.c[i][1];S.evScore+=sc;S.evDone++;add(10+sc*10);
 say(['Kurang tepat: tamu kecewa dan skor manajemen turun.','Cukup baik, masalah teratasi walau belum ideal.','Penanganan hebat! Tamu justru terkesan.'][sc]);render()}
function finish(){console.log('LEAD',{name:S.name,ig:S.ig,wa:S.wa,zone:S.zone,career:S.career,age:S.age,goal:S.goal,friends:S.friends})}

function map(mode){const z=S.zone;
 let g='<svg class="map" viewBox="0 0 400 260" role="img" aria-label="Peta Bali"><rect class="sea" width="400" height="260"/><ellipse cx="335" cy="195" rx="26" ry="14" class="land"/><path class="land" d="M40 120L90 85L160 70L250 75L330 90L370 120L340 140L300 135L270 160L255 200L225 240L180 245L150 215L120 175L70 150Z"/>';
 g+='<text x="20" y="25" font-size="12" font-weight="700" style="fill:var(--ink)">BALI</text>';
 for(const k in Z){const q=Z[k],sel=z===k,dim=mode==='lock'&&z&&!sel&&false;const act=S.stage===1;
  g+=`<g class="pin" ${act?`onclick="pickZone('${k}')" tabindex="0" role="button" aria-label="${q.n}" onkeydown="if(event.key==='Enter')pickZone('${k}')"`:''}><circle cx="${q.x}" cy="${q.y}" r="${sel?28:22}" fill="${q.c}" opacity=".35"/><circle cx="${q.x}" cy="${q.y}" r="${sel?11:9}" fill="${q.c}" stroke="${sel?'#d8602b':'#fff'}" stroke-width="${sel?4:2}"/><text x="${q.x}" y="${q.y+(k==='uluwatu'?-17:26)}" text-anchor="middle">${q.n} (${q.tier})</text></g>`}
 if(mode==='ops'&&z){const q=Z[z],o=[[-34,-22],[30,-18],[0,28]];o.forEach((d,i)=>{const pend=i>=S.evDone&&i<3;g+=`<text x="${q.x+d[0]}" y="${q.y+d[1]}" font-size="20" text-anchor="middle">🏡</text><text x="${q.x+d[0]}" y="${q.y+d[1]+12}" font-size="8" text-anchor="middle" style="fill:var(--ink)">${pend?'':'AKTIF'}</text>${pend?`<text class="pulse" x="${q.x+d[0]+12}" y="${q.y+d[1]-10}" font-size="14">⚠️</text>`:''}`})}
 else if(z&&S.stage>1)g+=`<text x="${Z[z].x}" y="${Z[z].y+4}" font-size="16" text-anchor="middle">🏡</text>`;
 return g+'</svg>'}
function villa(){const t=S.style==='trop',f=S.floors||1;
 let s='<svg class="map" viewBox="0 0 400 260" role="img" aria-label="Visual villa"><rect width="400" height="260" fill="#cfe8f3"/><path d="M0 150Q100 120 200 140T400 130V260H0Z" fill="#8fbf7f"/><path d="M0 175Q120 155 220 170T400 165V260H0Z" fill="#6aa86b"/>';
 if(S.pool)s+='<rect x="300" y="195" width="85" height="38" rx="12" fill="#4fc3e8" stroke="#fff" stroke-width="3"/>';
 s+='<text x="30" y="205" font-size="38">🌴</text><text x="335" y="190" font-size="30">🌴</text>';
 if(!S.style)s+='<rect x="95" y="130" width="190" height="75" rx="8" fill="none" stroke="#14607f" stroke-width="3" stroke-dasharray="8"/><text x="190" y="173" text-anchor="middle" font-size="14" fill="#14607f">Pilih gaya bangunan</text>';
 else{const wall=t?'#c9a27a':'#f6f1e7',roof=t?'#4a3a2c':'#c8643b',top=215-f*55;
  s+='<rect x="75" y="213" width="230" height="8" fill="#555"/>';
  for(let i=0;i<f;i++){const y=213-(i+1)*55;s+=`<rect x="90" y="${y}" width="190" height="55" fill="${wall}" stroke="#0003"/><rect x="105" y="${y+12}" width="55" height="43" fill="#7fb3c8"/><rect x="215" y="${y+12}" width="45" height="43" fill="#7fb3c8"/>`+(t?`<path d="M170 ${y}V${y+55}M180 ${y}V${y+55}M190 ${y}V${y+55}" stroke="#6b4a2f" stroke-width="4"/>`:`<path d="M215 ${y+55}V${y+30}A22 22 0 0 1 259 ${y+30}V${y+55}" fill="none" stroke="#c8643b" stroke-width="4"/>`)}
  s+=t?`<rect x="78" y="${top-10}" width="224" height="10" fill="${roof}"/>`:`<polygon points="80,${top} 185,${top-38} 290,${top}" fill="${roof}"/>`}
 return s+'</svg>'}
function fin(){const o=opt();return `<div class="stats"><div class="stat"><span>Pendapatan real-time</span><b>${fR(S.rate*occ(S.rate))} / malam</b></div><div class="stat"><span>Nilai pasar aset</span><b>${fM(cost()*1.25)}</b></div><div class="stat"><span>Okupansi</span><b>${Math.round(occ(S.rate)*100)}%</b></div><div class="stat"><span>Proyeksi ROI</span><b>${roi().toFixed(1)}% p.a.</b></div><div class="stat" style="grid-column:1/-1"><span>Tingkat optimasi finansial: ${Math.round(o)}%</span><div class="bar"><i style="width:${o}%;background:var(--ok)"></i></div></div></div>`}
function btn(on,txt,fn,sm){return `<button class="btn${on?' on':''}" onclick="${fn}">${txt}${sm?`<small>${sm}</small>`:''}</button>`}
function go(l){return `<button class="go" id="go" onclick="next()">${l||'Lanjut ▶'}</button>`}
function field(k,l,ph,type){return `<label for="f_${k}">${l}</label><input id="f_${k}" type="${type||'text'}" placeholder="${ph||''}" value="${esc(S[k])}" oninput="S.${k}=this.value;up()">`}

function render(){const st=S.stage;
 $('av').textContent=FACE[st];$('av').title=ROLES[st];$('bub').textContent=S.msg||GREET[st].replace('Selamat datang!',S.name&&st>0?'Halo '+S.name+'!':'Selamat datang!');
 let m='',o='',d='<h3>Database Info</h3>';
 const zz=S.zone&&Z[S.zone];
 if(st===0){m=map('x')+'<div class="note">Peta makro Bali: villa eksklusif dan plot potensial menunggumu. Isi profilmu di panel kanan bawah, lalu pilih tujuanmu.</div>';
  o='<h3>Pilih tujuanmu</h3>'+GOALS.map(g=>btn(S.goal===g,g,`set('goal','${g}')`)).join('')+go('Mulai Bangun ▶');
  d+=field('name','Nama','Nama panggilanmu')+field('ig','Akun Instagram','@username')}
 else if(st===1){m=map('x');
  o='<h3>Zona lokasi</h3>'+Object.keys(Z).map(k=>btn(S.zone===k,Z[k].n+' ('+Z[k].tier+')',`pickZone('${k}')`,'Lahan mulai '+fM(Z[k].land)+' | ROI '+Z[k].roi+'%+')).join('')+go();
  d+=`<div class="kv">Lokasi terpilih: <b>${zz?zz.n:'belum dipilih'}</b></div>`}
 else if(st===2){m=map('x')+`<div class="note">Estimasi lahan: <b>${fM(zz.land*(S.ground==='slope'?.9:1)+(S.plot==='prem'?.4:0))}</b>. Lahan miring lebih murah, tetapi biaya bangun naik.</div>`;
  o='<h3>Filter lahan</h3>'+btn(S.ground==='flat','Tanah datar',"set('ground','flat')")+btn(S.ground==='slope','Tanah miring',"set('ground','slope')")+btn(S.plot==='std','$ Budget',"set('plot','std')",'Plot standar')+btn(S.plot==='prem','$ Premium',"set('plot','prem')",'Plot dengan pemandangan, +Rp 0,40 M')+`<button class="go" style="background:var(--acc)" onclick="lockLand()">${S.locked?'🔒 Lahan terkunci':'Kunci lahan'}</button>`+go();
  d+=`<div class="kv">Terpilih: <b>${zz.n} Plot A</b></div>`+field('wa','WhatsApp (untuk rincian harga)','08xx-xxxx-xxxx','tel')}
 else if(st===3){m=villa()+`<div class="note">Kelengkapan desain eksterior: ${Math.round(sub()*100)}%</div>`;
  o='<h3>Katalog desain</h3>'+btn(S.style==='trop','Modern Tropical',"set('style','trop')",'Kayu hangat, atap datar')+btn(S.style==='med','Mediterranean',"set('style','med')",'Dinding putih, atap genteng, +Rp 0,15 M')+btn(S.pool===true,'Dengan kolam renang',"set('pool',true)",'+Rp 0,15 M')+btn(S.pool===false,'Tanpa kolam',"set('pool',false)")+btn(S.floors===1,'1 lantai',"set('floors',1)")+btn(S.floors===2,'2 lantai',"set('floors',2)",'+Rp 0,30 M')+go();
  d+=field('career','Karier / pekerjaan','Mis. Arsitek')+`<label for="f_age">Kategori umur</label><select id="f_age" onchange="S.age=this.value">${['18–29','30–45','46–60','60+'].map(a=>`<option${S.age===a?' selected':''}>${a}</option>`).join('')}</select>`}
 else if(st===4){const p=PAL[S.style||'trop'];m=villa()+`<div class="stats"><div class="stat"><span>Ketersediaan furnitur: ${Math.round(sub()*100)}%</span><div class="chips">${p.map(c=>`<div class="chip" style="background:${c}"></div>`).join('')}</div></div></div>`;
  o=Object.keys(F).map(k=>`<h3>${FN[k]}</h3>`+F[k].map((n,i)=>btn(S.furn[k]===i,n,`pickF('${k}',${i})`,i?'+Rp 0,10 M':'')).join('')).join('')+go();
  d+=`<div class="kv">Lahan: <b>${zz.n}</b><br>Gaya: <b>${S.style==='med'?'Mediterranean':'Modern Tropical'}</b><br>Total modal sementara: <b>${fM(cost())}</b></div>`}
 else if(st===5){m=map('x')+`<div id="fin">${fin()}</div>`+(S.reviews.length?`<div class="note"><b>Ulasan tamu maya</b><br>${S.reviews.map(esc).join('<br>')}</div>`:'');
  o=`<h3>Tarif harian</h3><div id="rt" style="font-weight:700">${fR(S.rate)} / malam</div><input type="range" aria-label="Tarif harian" min="${(base()*.5).toFixed(1)}" max="${(base()*2).toFixed(1)}" step="0.1" value="${S.rate}" oninput="setRate(this.value)" style="margin:6px 0 10px">`+btn(false,'Simulasi sewa','sim()','Jalankan simulasi tamu virtual')+btn(false,'Kalkulator ROI','calc()','Hitung proyeksi balik modal')+go();
  d+=field('friends','Undang Instagram teman','@teman1, @teman2')+`<div class="kv">Proyeksi ROI: <b>${roi().toFixed(1)}% p.a.</b></div>`}
 else if(st===6){const e=S.ev[S.evDone],stf=['Housekeeping','Tukang kebun','Teknisi kolam'];
  m=map('ops')+`<div class="stats"><div class="stat"><span>Performa operasional</span><b>${perf()}%</b></div><div class="stat"><span>Kesiapan peluncuran</span><b>${Math.round((S.evDone/3*60)+(perf()/100*40))}%</b></div></div>`;
  o='<h3>Staf</h3>'+stf.map(s=>btn(S.staff[s],(S.staff[s]?'✔ ':'')+s,`staff('${s}')`)).join('')+(e?`<h3>${e.t}</h3><div class="note" style="margin:0 0 8px">${e.d}</div>`+e.c.map((c,i)=>btn(false,c[0],`choose(${i})`)).join(''):'<div class="note">Semua kejadian tertangani.</div>')+go('Lihat hasil akhir ▶');
  d+=`<div class="kv">Log operasional: <b>${S.evDone ? 'diperbarui' : 'kosong'}</b><br>Skor manajemen: <b>${S.evDone?mgmt():'-'} / 5</b><br>Status pendaftaran: <b>PENDING</b></div>`}
 else{finish();const left=SLOTS_LEFT;
  m=`<h3>Villa impianmu di ${zz.n}</h3><div class="stats"><div class="stat"><span>Gaya</span><b>${S.style==='med'?'Mediterranean':'Modern Tropical'}</b></div><div class="stat"><span>Modal total</span><b>${fM(cost())}</b></div><div class="stat"><span>Proyeksi ROI</span><b>${roi().toFixed(1)}% p.a.</b></div><div class="stat"><span>Skor manajemen</span><b>${mgmt()} / 5</b></div><div class="stat"><span>Performa operasional</span><b>${perf()}%</b></div><div class="stat"><span>Total XP</span><b>${S.pts}</b></div></div>`+villa();
  o=`<h3>Konsultasi eksklusif</h3><div class="note">Sesi konsultasi dibatasi. Sisa kuota: <b>${left} dari ${SLOTS_TOTAL}</b><div class="slots" style="margin-top:6px">${Array.from({length:SLOTS_TOTAL},(_,i)=>`<i class="${i<left?'':'x'}"></i>`).join('')}</div></div><a class="go" href="${CTA_URL}" target="_blank" rel="noopener">Amankan sesi konsultasi di mysea.id</a><button class="btn" style="margin-top:8px" onclick="location.reload()">Main lagi</button>`;
  d+=`<div class="kv">Pemain: <b>${esc(S.name)}</b> ${esc(S.ig)}<br>WhatsApp: <b>${esc(S.wa)}</b><br>Pendaftaran konsultasi: <b>PENDING</b></div>`}
 $('main').innerHTML=m;$('opt').innerHTML=o;$('db').innerHTML=d;up()}
render();
</script>
